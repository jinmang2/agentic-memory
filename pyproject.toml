[project]
name = "agmem"
version = "0.1.0"
description = "An agentic-memory framework with an MCP server, and nine methodologies behind one capability-gated API, each pinned to the lineage it reproduces"
authors = [
    { name = "MyungHoon Jin", email = "jinmang2@gmail.com" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agentic-memory", "llm", "memory", "rag", "mcp", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1",
    "numpy>=2.5.1",
    "openai>=2.45.0",
    "sqlite-vec>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/jinmang2/agentic-memory"
Repository = "https://github.com/jinmang2/agentic-memory"
Documentation = "https://github.com/jinmang2/agentic-memory/tree/main/docs"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
agmem-mcp = "agmem.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
embed = ["sentence-transformers>=3.0"]
# Real backend engines (user directive: wire the actual stacks, naive
# in-python fallbacks are banned as runtime defaults — docs/03 §5)
backends = [
    "lancedb>=0.15",
    "qdrant-client>=1.12",
    "chromadb>=0.5",
    "kuzu>=0.7",
    "neo4j>=5.20",
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.1",
]

[tool.uv]
default-groups = ["dev", "embed", "backends"]

[project.optional-dependencies]
# Upstream scorers we call rather than reimplement. nltk is what
# WujiangXu/A-Mem's calculate_metrics uses for BLEU-1 (word_tokenize +
# sentence_bleu); without it `locomo.bleu1_wujiang` degrades to None and the
# metric is omitted, never substituted (see its docstring).
eval = ["nltk>=3.9"]
# MemMachine's `TextSegmenter` IS langchain's RecursiveCharacterTextSplitter
# (chunk 500, overlap 0, a 30-entry separator list); the organizer calls it
# rather than reimplementing the recursion, and raises when it is absent. Only
# the non-default `segmenter="text"` path needs it — both presets ship
# passthrough, so a plain install never touches this. `nltk` above covers the
# equally non-default `deriver="sentence_text"` (upstream `extract_sentences`).
memmachine = ["langchain-text-splitters>=0.3"]
# The LongMemEval-V2 harness (~/.agmem/upstream/longmemeval-v2) imported by
# `agmem.bench.lme_v2`: its memory registry pulls in every baseline, one of which
# is built on the OpenAI Agents SDK, and the reader-side truncation loads the
# Qwen3.5-9B processor through transformers and PIL. Only `python -m
# agmem.bench.lme_v2 run|estimate` needs these; the adapter class does not.
lme-v2 = [
    "openai-agents>=0.1",
    "pillow>=10",
    "tqdm>=4.66",
    "transformers>=4.51",
    "huggingface_hub>=0.30",
    # The Qwen3.5-9B processor the harness tokenizes with is a vision-language
    # one whose video processor imports torchvision (upstream's `torch` extra).
    "torchvision>=0.28",
]
train = [
    "transformers>=4.51",
    "datasets>=3.0",
    "peft>=0.14",
    "bitsandbytes>=0.45",
    "accelerate>=1.0",
]

# Ruff is the project's single lint + format tool (policy: ruff format,
# line-length 100, comments exempt from length).
[tool.ruff]
line-length = 100
